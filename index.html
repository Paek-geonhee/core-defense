<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090e1b"><title>중앙 방어전</title><link rel="stylesheet" href="style.css"></head>
<body><main class="shell"><header><div><span class="eyebrow">ARCADE / SURVIVAL</span><h1>중앙 방어전 <small>CORE DEFENSE</small></h1></div><p>사방에서 몰려오는 적으로부터 코어를 지키세요.</p></header><section class="game-wrap"><canvas id="game" aria-label="중앙 방어전 게임 화면"></canvas><div id="overlay" class="overlay"><div class="panel"><span class="eyebrow">HOLD YOUR GROUND</span><h2 id="title">중앙을 사수하세요</h2><p id="message">화면을 누른 채 방향을 조준하면 자동으로 발사합니다.<br>아이템을 탄환으로 맞혀 획득하세요.</p><div class="legend"><span><i class="heal"></i> 체력 +1</span><span><i class="blast"></i> 주변 적 처치</span><span><i class="bonus"></i> 점수 +100</span></div><button id="start">게임 시작 <span>↗</span></button><button id="exit" class="secondary" hidden>게임 종료</button></div></div></section><footer><span><b>조작</b> 마우스 또는 터치를 누른 채 조준</span><span><b>목표</b> 최대한 오래 살아남기</span><span>적 처치 +10 · 최대 체력 5</span></footer></main><script src="game.js"></script></body></html>
